# Redaction leak suite (Phase 5). A red run here means a redacted file could still
# hold the fake SSN somewhere: do not ship. Also runs the rest of the Vitest suite.
name: redaction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # qpdf.exe (pinned by SHA-256) into src-tauri/vendor/qpdf.
      - run: node scripts/fetch-win-binaries.mjs
      # Tesseract for the OCR check (Apache-2.0, test-only).
      # The Chocolatey feed sometimes answers 503: retry, then fail here, not in the tests.
      - name: Install Tesseract
        run: |
          $exe = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          for ($i = 1; $i -le 3 -and -not (Test-Path $exe); $i++) {
            choco install tesseract --no-progress -y
            if (-not (Test-Path $exe)) { Start-Sleep -Seconds (20 * $i) }
          }
          if (-not (Test-Path $exe)) { throw "Tesseract did not install" }
          & $exe --version
          echo "TESSERACT=$exe" >> $env:GITHUB_ENV
      - run: npm run corpus
      - run: npx vitest run tests/redaction
      - run: npx vitest run
